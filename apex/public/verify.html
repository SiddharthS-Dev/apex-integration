<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef2f8" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Check that an Inspironics Academia certificate is genuine." />
    <title>Certificate check · Apex</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <style>
      /*
       * Public certificate verification.
       *
       * A certificate's link (/academia/verify/<id>) must work for anyone —
       * the person a certificate is shown to has no Apex account. Signed out,
       * the gateway serves this page there instead of the Academia app, and
       * lets exactly one API call through for it:
       * POST /academia/api/functions/verifyCertificate { certificate_id }.
       * Signed in, the Academia's own page is shown as before.
       *
       * Hand-written and self-contained like the sign-in page (same tokens,
       * dark by default, light when the system asks for it). Everything the
       * API returns is written with textContent — nothing is parsed as HTML.
       */
      :root {
        color-scheme: dark;
        --bg: #030712;
        --panel: rgba(15, 23, 42, 0.6);
        --text: #f8fafc;
        --text-2: #cbd5e1;
        --muted: #94a3b8;
        --border: rgba(148, 163, 184, 0.18);
        --cyan: #00e5ff;
        --blue: #3b82f6;
        --green: #10b981;
        --danger: #fb7185;
        --glow: rgba(37, 99, 235, 0.18);
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #eef2f8;
          --panel: rgba(255, 255, 255, 0.82);
          --text: #0f172a;
          --text-2: #334155;
          --muted: #64748b;
          --border: rgba(15, 23, 42, 0.12);
          --cyan: #0891b2;
          --blue: #2563eb;
          --green: #059669;
          --danger: #e11d48;
          --glow: rgba(37, 99, 235, 0.12);
        }
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background:
          radial-gradient(700px 520px at 50% 0%, var(--glow), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: min(480px, 100%);
        padding: 32px 28px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--panel);
        backdrop-filter: blur(14px);
        box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.6);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 26px;
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .brand img {
        width: 26px;
        height: 26px;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.45rem;
        letter-spacing: -0.01em;
      }
      .lead {
        margin: 0 0 22px;
        color: var(--text-2);
        font-size: 0.95rem;
        line-height: 1.55;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 18px;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        border: 1px solid currentColor;
      }
      .badge i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: currentColor;
      }
      [data-state='checking'] .badge {
        color: var(--muted);
      }
      [data-state='valid'] .badge {
        color: var(--green);
      }
      [data-state='invalid'] .badge,
      [data-state='error'] .badge {
        color: var(--danger);
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 10px 18px;
        margin: 0;
        padding: 18px 0 0;
        border-top: 1px solid var(--border);
      }
      dl[hidden] {
        display: none;
      }
      dt {
        color: var(--muted);
        font-size: 0.82rem;
      }
      dd {
        margin: 0;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      code {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
        font-size: 0.85rem;
        color: var(--cyan);
      }
      .foot {
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .foot a {
        color: var(--blue);
      }
    </style>
  </head>
  <body>
    <main class="card" id="card" data-state="checking" aria-live="polite">
      <div class="brand"><img src="/logo.svg" alt="" />Inspironics Academia</div>
      <span class="badge"><i></i><span id="badge">Checking</span></span>
      <h1 id="title">Checking this certificate…</h1>
      <p class="lead" id="lead">One moment.</p>
      <dl id="details" hidden>
        <dt>Awarded to</dt>
        <dd id="name"></dd>
        <dt>Course</dt>
        <dd id="course"></dd>
        <dt>Score</dt>
        <dd id="score"></dd>
        <dt>Completed</dt>
        <dd id="date"></dd>
        <dt>Certificate</dt>
        <dd><code id="cid"></code></dd>
      </dl>
      <p class="foot">Have an Apex account? <a href="/login">Sign in</a> for the full record.</p>
    </main>

    <script>
      ;(() => {
        const $ = (id) => document.getElementById(id)
        // /academia/verify/<id>: the mount is whatever precedes /verify/, so
        // the API call follows the page wherever the Academia is mounted.
        const match = location.pathname.match(/^(.*)\/verify\/([^/]+)\/?$/)
        let id = ''
        try {
          id = match ? decodeURIComponent(match[2]) : ''
        } catch {}

        const show = (state, badge, title, lead) => {
          $('card').dataset.state = state
          $('badge').textContent = badge
          $('title').textContent = title
          $('lead').textContent = lead
        }

        if (!id || id.length > 200) {
          show('invalid', 'Not found', 'No certificate here', 'This link does not name a certificate.')
          return
        }

        fetch(`${match[1]}/api/functions/verifyCertificate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'omit',
          body: JSON.stringify({ certificate_id: id }),
        })
          .then((r) => (r.ok ? r.json() : Promise.reject(new Error(String(r.status)))))
          .then((cert) => {
            if (!cert || cert.valid !== true) {
              show(
                'invalid',
                'Not valid',
                'Certificate not found',
                'No certificate with this ID was issued by Inspironics Academia. Check the link, or ask the holder for a new one.'
              )
              return
            }
            show('valid', 'Verified', 'This certificate is genuine', 'Issued by Inspironics Academia.')
            $('name').textContent = String(cert.user_name || '—')
            $('course').textContent = String(cert.course_title || '—')
            const score = Number(cert.score)
            $('score').textContent = Number.isFinite(score) ? `${Math.round(score)}%` : '—'
            const when = cert.completion_date ? new Date(cert.completion_date) : null
            $('date').textContent =
              when && !Number.isNaN(when.getTime())
                ? new Intl.DateTimeFormat(undefined, { dateStyle: 'long' }).format(when)
                : '—'
            $('cid').textContent = String(cert.certificate_id || id)
            $('details').hidden = false
          })
          .catch(() =>
            show('error', 'Unavailable', 'Could not check right now', 'The Academia did not answer. Try again in a moment.')
          )
      })()
    </script>
  </body>
</html>
