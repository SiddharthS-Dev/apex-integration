# Apex CI: the gateway and all three products, on every push and pull request.
#
# GitHub only runs workflows from the repository root, so this replaces the
# per-product workflow that used to live in inspironics-innovation-showcase/.github
# (which never ran here — audit F-002).
name: CI

on:
  push:
    branches: [main, develop, 'Feature-**', 'feature-**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  gateway:
    name: Apex gateway
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apex } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Syntax
        run: for f in *.mjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Discovery tools (R0 user overlap report, fixture data only)
        working-directory: tools/discovery
        run: node --test user-overlap.test.mjs
      - name: Staging tooling (secret generation, smoke helpers, compose consistency)
        working-directory: deploy/staging
        run: |
          for f in *.mjs; do node --check "$f"; done
          node --test staging.test.mjs

  # ---------------------------------------------------------------- security scanning --
  # Free, open-source scanners; no account or token needed. All are blocking. An accepted false
  # positive goes in .gitleaks.toml / .semgrepignore / .trivyignore.yaml / deploy/staging/zap-rules.tsv,
  # scoped as narrowly as possible and with a reason. Triage and fix timelines: SECURITY.md.

  secret-scan:
    name: Secret scanning (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (findings are printed and reported with the secret value redacted)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.21.2 -c \
            'git config --global --add safe.directory /repo && gitleaks detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner --report-format sarif --report-path /repo/reports/gitleaks.sarif --exit-code 1'
      - name: Keep the gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: gitleaks-report, path: reports/, if-no-files-found: ignore, retention-days: 14 }

  sast:
    name: Static analysis (Semgrep OSS rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: semgrep (JavaScript incl. Express, Node.js, React, OWASP Top 10; ERROR severity fails)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.95.0 semgrep scan --metrics=off \
            --config p/javascript --config p/nodejs --config p/react --config p/owasp-top-ten \
            --severity ERROR --error --sarif-output=reports/semgrep.sarif
      - name: Keep the Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: semgrep-report, path: reports/, if-no-files-found: ignore, retention-days: 14 }

  iac-scan:
    name: Dockerfile and Compose misconfiguration (Trivy config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: trivy config
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.57.1 config --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile .trivyignore.yaml --skip-dirs inspironics-innovation-showcase/legacy .

  academia:
    name: Inspironics Academia
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 'Inspironics Academia' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: 'Inspironics Academia/package-lock.json'
      - run: npm ci
      - name: API tests
        run: npm test -w @academy/api
      - name: Web build
        run: npm run build -w @academy/web
      - name: Dependency advisories (production, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency advisories (all, incl. build tools; critical; report only)
        continue-on-error: true
        run: npm audit --audit-level=critical

  showcase:
    name: Innovation Showcase
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: inspironics-innovation-showcase } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: inspironics-innovation-showcase/package-lock.json
      - run: npm ci
      - name: Shared contracts
        run: npm test -w @inspironics/shared
      - name: API tests
        run: npm test -w @inspironics/api
      - name: Web architecture boundaries
        run: npm run lint:arch -w @inspironics/web
      - name: Web types
        run: npm run typecheck -w @inspironics/web
      - name: Web tests
        run: npm test -w @inspironics/web
      - name: Ecosystem routes resolve
        run: npm run check:routes -w @inspironics/web
      - name: Environment contract
        run: npm run check:env -w @inspironics/web
      - name: Production build and payload budget
        run: npm run build -w @inspironics/web
      - name: Dependency advisories (production, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency advisories (all, incl. build tools; critical; report only)
        continue-on-error: true
        run: npm audit --audit-level=critical

  slidesvault:
    name: SlidesVault
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 'slide vault' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: 'slide vault/package-lock.json'
      - run: npm ci
      - name: API tests (unit, integration, end-to-end)
        run: npm test
      - name: Web build
        run: npm run build
      - name: Dependency advisories (production, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency advisories (all, incl. build tools; critical; report only)
        continue-on-error: true
        run: npm audit --audit-level=critical

  slidesvault-image:
    name: SlidesVault API image
    runs-on: ubuntu-latest
    needs: slidesvault
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        working-directory: 'slide vault'
        run: docker build -f apps/api/Dockerfile -t slidesvault-api:ci .

  postgres:
    name: Postgres mode (SlidesVault migrations)
    runs-on: ubuntu-latest
    continue-on-error: true  # first runs against Postgres; promote to required once green
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: apex }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_DRIVER: postgres
      DATABASE_URL: postgres://postgres:ci@localhost:5432/apex
      # A throwaway 32-byte key: the config refuses to start without one.
      DROPBOX_TOKEN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: SlidesVault migrations on Postgres
        working-directory: 'slide vault'
        run: npm ci && npm run migrate

  core-postgres:
    name: Postgres mode (Core migrations incl. 008–011, identity rollback drill; Showcase migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway databases on a throwaway server; nothing here is a real credential.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
      CORE_DB: postgres://postgres:ci@localhost:5432/core_ci
      SHOWCASE_DB: postgres://postgres:ci@localhost:5432/showcase_ci
      CORE_TABLES: "'organizations','organization_memberships','role_assignments','identity_links','external_identities','audit_events','user_session_epochs','link_challenges','registration_requests','registration_decoys'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Create the throwaway databases
        run: psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE core_ci' -c 'CREATE DATABASE showcase_ci'
      - name: Install (Academia)
        working-directory: 'Inspironics Academia'
        run: npm ci
      - name: Core migrations on Postgres 16, twice (the second run must be a no-op)
        working-directory: 'Inspironics Academia/apps/api'
        env: { DATABASE_URL: '${{ env.CORE_DB }}' }
        run: |
          node --disable-warning=ExperimentalWarning src/db/migrate-cli.js
          node --disable-warning=ExperimentalWarning src/db/migrate-cli.js
      - name: R1 migrations (008, 009, 010, 011) and core_identity_backfill recorded, ten Core tables, Inspironics organisation
        run: |
          test "$(psql -d core_ci -tAc "SELECT count(*) FROM schema_migrations WHERE id IN ('008_core_identity','009_user_session_epochs','010_link_challenges','011_registration_requests','core_identity_backfill')")" = 5
          test "$(psql -d core_ci -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ($CORE_TABLES)")" = 10
          test "$(psql -d core_ci -tAc "SELECT count(*) FROM organizations WHERE slug='inspironics' AND kind='internal'")" = 1
      - name: Identity rollback drill (core:rollback-identity on this throwaway database), then re-apply
        working-directory: 'Inspironics Academia/apps/api'
        env: { DATABASE_URL: '${{ env.CORE_DB }}' }
        run: |
          users_before="$(psql -d core_ci -tAc 'SELECT count(*) FROM users')"
          node src/core/cli/rollback-identity.js --yes
          test "$(psql -d core_ci -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ($CORE_TABLES)")" = 0
          test "$(psql -d core_ci -tAc "SELECT count(*) FROM schema_migrations WHERE id IN ('008_core_identity','009_user_session_epochs','010_link_challenges','011_registration_requests','core_identity_backfill')")" = 0
          test "$(psql -d core_ci -tAc 'SELECT count(*) FROM users')" = "$users_before"
          node --disable-warning=ExperimentalWarning src/db/migrate-cli.js
          test "$(psql -d core_ci -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ($CORE_TABLES)")" = 10
      - name: Install (Showcase)
        working-directory: inspironics-innovation-showcase
        run: npm ci
      - name: Showcase migrations on Postgres 16 (incl. 002_core_user_id), its rollback, re-apply
        working-directory: inspironics-innovation-showcase/apps/api
        env: { DATABASE_URL: '${{ env.SHOWCASE_DB }}' }
        run: |
          node --disable-warning=ExperimentalWarning src/db/migrate.js
          node --disable-warning=ExperimentalWarning src/db/migrate.js --rollback 002_core_user_id
          test "$(psql -d showcase_ci -tAc "SELECT count(*) FROM information_schema.columns WHERE table_name='users' AND column_name='core_user_id'")" = 0
          node --disable-warning=ExperimentalWarning src/db/migrate.js
          test "$(psql -d showcase_ci -tAc "SELECT count(*) FROM information_schema.columns WHERE table_name='users' AND column_name='core_user_id'")" = 1

  staging-smoke:
    name: Private staging stack (images, compose, end-to-end smoke)
    runs-on: ubuntu-latest
    needs: [gateway, academia, showcase, slidesvault, core-postgres]
    timeout-minutes: 45
    env:
      COMPOSE: docker compose -f deploy/staging/compose.yml --env-file deploy/staging/.env.staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Generate throwaway secrets (this run only; never uploaded)
        run: node deploy/staging/generate-secrets.mjs --admin-email staging-admin@apex-ci.invalid
      - name: Compose file resolves
        run: $COMPOSE config --quiet
      - name: Build the four images and start the stack (waits for every healthcheck)
        run: $COMPOSE up -d --build --wait --wait-timeout 600
      - name: Container image scan (Trivy; HIGH/CRITICAL with a fix available)
        run: |
          TAG="$(grep '^APEX_IMAGE_TAG=' deploy/staging/.env.staging | cut -d= -f2)"
          status=0
          for img in gateway core showcase-api slidesvault-api; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "apex-staging/$img:$TAG" || status=1
          done
          exit $status
      - name: Smoke test through the gateway (health, sign-in, assertions, forged headers, sign-out)
        run: node deploy/staging/smoke.mjs gateway
      - name: Dynamic scan (OWASP ZAP baseline, passive, against the gateway)
        # Rules marked FAIL in deploy/staging/zap-rules.tsv fail the build; the others are reported.
        run: |
          PORT="$(grep '^APEX_STAGING_PORT=' deploy/staging/.env.staging | cut -d= -f2)"
          mkdir -p zap && chmod 777 zap && cp deploy/staging/zap-rules.tsv zap/
          # Exit 1 = a FAIL rule matched (fails at once). Exit 3 = ZAP itself errored (seen once in
          # CI with no finding): retry that, once, so a ZAP glitch cannot block or hide a real result.
          for attempt in 1 2; do
            status=0
            docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" zaproxy/zap-stable:2.15.0 \
              zap-baseline.py -t "http://127.0.0.1:${PORT:-4173}/login" -c zap-rules.tsv -I \
              -r zap-report.html -J zap-report.json || status=$?
            [ "$status" -ne 3 ] && break
            echo "ZAP internal error (exit 3) on attempt $attempt"
          done
          exit $status
      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap/
          if-no-files-found: ignore
          retention-days: 14
      - name: Direct backend bypass attempts from a throwaway container on the backend network
        run: |
          TAG="$(grep '^APEX_IMAGE_TAG=' deploy/staging/.env.staging | cut -d= -f2)"
          KID="$(grep '^APEX_IDENTITY_KID=' deploy/staging/.env.staging | cut -d= -f2)"
          docker run --rm --network apex-staging-backend --read-only -e SMOKE_KID="$KID" \
            -v "$PWD/deploy/staging/smoke.mjs:/smoke/smoke.mjs:ro" --entrypoint node \
            "apex-staging/showcase-api:$TAG" /smoke/smoke.mjs bypass
      - name: Encrypted backup of the stack, verified, and a decrypted dump readable by pg_restore
        run: |
          B="$RUNNER_TEMP/apex-backups"
          node deploy/staging/backup.mjs --out "$B"
          node deploy/staging/backup.mjs verify --out "$B"
          SET="$(ls "$B" | sort | tail -1)"
          node deploy/staging/backup.mjs decrypt "$B/$SET/core.dump.enc" "$RUNNER_TEMP/core.dump"
          $COMPOSE exec -T postgres pg_restore --list < "$RUNNER_TEMP/core.dump" | grep -q 'TABLE public users'
          rm -rf "$B" "$RUNNER_TEMP/core.dump"
      - name: Stack status and logs
        if: failure()
        run: |
          $COMPOSE ps -a
          $COMPOSE logs --no-color --timestamps
      - name: Tear down, volumes included
        if: always()
        run: if [ -f deploy/staging/.env.staging ]; then $COMPOSE down -v --remove-orphans; fi
